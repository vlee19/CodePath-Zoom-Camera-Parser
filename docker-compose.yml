services:
    frontend:
        build: ./frontend
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules

    backend:
        build: ./backend
        ports:
            - "3001:3001"
        env_file:
            ./backend/.env
        volumes:
            - ./backend:/app
            - /app/node_modules
